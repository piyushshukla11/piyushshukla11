name: Auto Update GitHub Metrics HUD

on:
  schedule:
    # Runs everyday at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install Pillow numpy

      - name: Update Profile Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats/pixel_github_stats.png
          if git diff --staged --quiet; then
            echo "No changes in stats detected."
          else
            git commit -m "Auto-update GitHub metrics HUD stats [skip ci]"
            git push
          fi
